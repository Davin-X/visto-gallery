      const params = new URLSearchParams(window.location.search);
      const benchmarkItems = Number(params.get("benchmark") || 0);
      const isBenchmark = Number.isFinite(benchmarkItems) && benchmarkItems > 0;
      const totalItems = Math.max(0, Math.floor(benchmarkItems || 0));
      // `videos=N` renders the first N synthetic items as videos so the tile's
      // play-in-background action can be exercised.
      const videoCount = Math.max(0, Math.floor(Number(params.get("videos") || 0)));
      const PAGE_SIZE = 250;
      const now = Date.UTC(2026, 10, 3, 12, 0, 0);
      const tinyImage =
        "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
      // A real 1-second H.264 clip so the video player in the harness mounts a
      // decodable <video> element instead of the decode-failure screen.

        "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAABERtZGF03ABMYXZjNjMuMS4xMDIAAjBADgAAAq4GBf//qtxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjUgcjMyMjIgYjM1NjA1YSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjUgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0xIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDM6MHgxMTMgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTEgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MyBiX3B5cmFtaWQ9MiBiX2FkYXB0PTEgYl9iaWFzPTAgZGlyZWN0PTEgd2VpZ2h0Yj0xIG9wZW5fZ29wPTAgd2VpZ2h0cD0yIGtleWludD0yNTAga2V5aW50X21pbj0yNSBzY2VuZWN1dD00MCBpbnRyYV9yZWZyZXNoPTAgcmNfbG9va2FoZWFkPTQwIHJjPWNyZiBtYnRyZWU9MSBjcmY9MjMuMCBxY29tcD0wLjYwIHFwbWluPTAgcXBtYXg9NjkgcXBzdGVwPTQgaXBfcmF0aW89MS40MCBhcT0xOjEuMDAAgAAAAA9liIQAO//+906/AptUwmEAAAAIQZokbEO//uAAAAAIQZ5CeIX/wYEBGCAHAAAACAGeYXRCv8SAAAAACAGeY2pCv8SBAAAADkGaaEmoQWiZTAh3//7hARggBwAAAApBnoZFESwv/8GBAAAACAGepXRCv8SBAAAACAGep2pCv8SAARggBwAAAA5BmqxJqEFsmUwId//+4AAAAApBnspFFSwv/8GBAAAACAGe6XRCv8SAARggBwAAAAgBnutqQr/EgAAAAA5BmvBJqEFsmUwIb//+4QAAAApBnw5FFSwv/8GBARggBwAAAAgBny10Qr/EgQAAAAgBny9qQr/EgAAAAA5BmzRJqEFsmUwIZ//+4AAAAApBn1JFFSwv/8GBARggBwAAAAgBn3F0Qr/EgAAAAAgBn3NqQr/EgAAAAA5Bm3hJqEFsmUwIV//+wQEYIAcAAAAKQZ+WRRUsL//BgAAAAAgBn7V0Qr/EgQAAAAgBn7dqQr/EgQAABwVtb292AAAAbG12aGQAAAAAAAAAAAAAAAAAAB9AAAAfQAABAAABAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADw3RyYWsAAABcdGtoZAAAAAMAAAAAAAAAAAAAAAEAAAAAAAAfQAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAEAAAABAAAAAAACRlZHRzAAAAHGVsc3QAAAAAAAAAAQAAH0AAAAQAAAEAAAAAAzttZGlhAAAAIG1kaGQAAAAAAAAAAAAAAAAAADIAAAAyAFXEAAAAAAAtaGRscgAAAAAAAAAAdmlkZQAAAAAAAAAAAAAAAFZpZGVvSGFuZGxlcgAAAALmbWluZgAAABR2bWhkAAAAAQAAAAAAAAAAAAAAJGRpbmYAAAAcZHJlZgAAAAAAAAABAAAADHVybCAAAAABAAACpnN0YmwAAAC+c3RzZAAAAAAAAAABAAAArmF2YzEAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAEAAQAEgAAABIAAAAAAAAAAEUTGF2YzYzLjEuMTAyIGxpYngyNjQAAAAAAAAAAAAAAAAY//8AAAA0YXZjQwFkAAr/4QAXZ2QACqzZXsBEAAADAAQAAAMAyDxIllgBAAZo6+PLIsD9+PgAAAAAEHBhc3AAAAABAAAAAQAAABRidHJ0AAAAAAAAIGgAAAAAAAAAGHN0dHMAAAAAAAAAAQAAABkAAAIAAAAAFHN0c3MAAAAAAAAAAQAAAAEAAADYY3R0cwAAAAAAAAAZAAAAAQAABAAAAAABAAAKAAAAAAEAAAQAAAAAAQAAAAAAAAABAAACAAAAAAEAAAoAAAAAAQAABAAAAAABAAAAAAAAAAEAAAIAAAAAAQAACgAAAAABAAAEAAAAAAEAAAAAAAAAAQAAAgAAAAABAAAKAAAAAAEAAAQAAAAAAQAAAAAAAAABAAACAAAAAAEAAAoAAAAAAQAABAAAAAABAAAAAAAAAAEAAAIAAAAAAQAACgAAAAABAAAEAAAAAAEAAAAAAAAAAQAAAgAAAAA0c3RzYwAAAAAAAAADAAAAAQAAAAMAAAABAAAABgAAAAQAAAABAAAABwAAAAMAAAABAAAAeHN0c3oAAAAAAAAAAAAAABkAAALFAAAADAAAAAwAAAAMAAAADAAAABIAAAAOAAAADAAAAAwAAAASAAAADgAAAAwAAAAMAAAAEgAAAA4AAAAMAAAADAAAABIAAAAOAAAADAAAAAwAAAASAAAADgAAAAwAAAAMAAAAMHN0Y28AAAAAAAAACAAAAEMAAAMkAAADUgAAA3wAAAOsAAAD3AAABBgAAARGAAACbXRyYWsAAABcdGtoZAAAAAMAAAAAAAAAAAAAAAIAAAAAAAAcAAAAAAAAAAAAAAAAAQEAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAACRlZHRzAAAAHGVsc3QAAAAAAAAAAQAAHAAAAAQAAAEAAAAAAeVtZGlhAAAAIG1kaGQAAAAAAAAAAAAAAAAAAB9AAAAgAFXEAAAAAAAtaGRscgAAAAAAAAAAc291bgAAAAAAAAAAAAAAAFNvdW5kSGFuZGxlcgAAAAGQbWluZgAAABBzbWhkAAAAAAAAAAAAAAAkZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAAFUc3RibAAAAH5zdHNkAAAAAAAAAAEAAABubXA0YQAAAAAAAAABAAAAAAAAAAAAAQAQAAAAAB9AAAAAAAA2ZXNkcwAAAAADgICAJQACAASAgIAXQBUAAAAAALuAAAABbwWAgIAFFYhW5QAGgICAAQIAAAAUYnRydAAAAAAAALuAAAABbwAAABhzdHRzAAAAAAAAAAEAAAAIAAAEAAAAABxzdHNjAAAAAAAAAAEAAAABAAAAAQAAAAEAAAA0c3RzegAAAAAAAAAAAAAACAAAABMAAAAEAAAABAAAAAQAAAAEAAAABAAAAAQAAAAEAAAAMHN0Y28AAAAAAAAACAAAADAAAAMgAAADTgAAA3gAAAOoAAAD2AAABBQAAARCAAAAGnNncGQBAAAAcm9sbAAAAAIAAAAB//8AAAAcc2JncAAAAAByb2xsAAAAAQAAAAgAAAABAAAAYXVkdGEAAABZbWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAbWRpcmFwcGwAAAAAAAAAAAAAAAAsaWxzdAAAACSpdG9vAAAAHGRhdGEAAAABAAAAAExhdmY2My4xLjEwMg==";

      const makeItems = () =>
        Array.from({ length: totalItems }, (_, index) => {
          const capturedAt = now - index * 60_000;
          const isVideo = index < videoCount;
          const extension = isVideo ? "mp4" : "jpg";
          return {
            id: `benchmark-${index}`,
            path: isVideo ? tinyVideoData : `/synthetic/benchmark-${index}.${extension}`,
            name: `benchmark-${index}.${extension}`,
            extension,
            kind: isVideo ? "video" : "photo",
            size: 1024 * 1024,
            modifiedAt: capturedAt,
            capturedAt,
            width: 1,
            height: 1,
            favorite: index % 11 === 0,
            hidden: false,
            rating: index % 6,
            colorLabel: ["red", "yellow", "green", "blue", "purple"][index % 5],
            tags: index % 17 === 0 ? ["benchmark"] : [],
            albumIds: index < 4 ? ["benchmark-album-0"] : [],
            createdAt: capturedAt,
            updatedAt: capturedAt,
          };
        });
      const items = makeItems();
      const benchmark = {
        calls: Object.create(null),
        activeThumbnails: 0,
        maxActiveThumbnails: 0,
      };
      window.__benchmark = benchmark;

      const count = (command) => {
        benchmark.calls[command] = (benchmark.calls[command] || 0) + 1;
      };
      const tinyThumbnail = {
        itemId: "",
        dataUrl: tinyImage,
        width: 1,
        height: 1,
      };

      const syntheticInvoke = async (command, args) => {
        count(command);
        if (command === "get_settings") return {};
        if (command === "get_version") return "0.2.2";
        if (command === "get_vault_status") {
          return { configured: false, locked: true, itemCount: 0 };
        }
        if (command === "get_library_stats") {
          return {
            photos: totalItems - videoCount,
            videos: videoCount,
            raws: 0,
            animations: 0,
            animationsSize: 0,
            uncategorized: 0,
            favorites: Math.floor(totalItems / 11),
            hidden: 0,
            photoSize: totalItems * 1024 * 1024,
            videoSize: 0,
            rawSize: 0,
            uncategorizedSize: 0,
            favoriteSize: Math.floor(totalItems / 11) * 1024 * 1024,
            hiddenSize: 0,
            totalSize: totalItems * 1024 * 1024,
          };
        }
        if (command === "get_library_roots") return ["/synthetic"];
        if (command === "get_library_folders") {
          return [
            {
              path: "/synthetic",
              name: "synthetic",
              itemCount: totalItems,
              totalSize: totalItems * 1024 * 1024,
            },
          ];
        }
        if (command === "watch_folder" || command === "unwatch_folder") return null;
        if (command === "get_smart_albums") {
          // A few seeded smart albums so the Albums page can be exercised with
          // the collapsed section expanded.
          const nowTs = Date.now();
          return Array.from({ length: 8 }, (_, index) => ({
            id: `smart-${index}`,
            name: ["Favorites", "RAW+Jpeg", "Autumn shots", "Videos", "People", "2024", "Best of", "Travel"][index],
            filter: index === 0 ? { favorite: true } : index === 1 ? { kind: "raw" } : { query: "autumn" },
            itemCount: index === 0 ? 11 : 7,
            coverItems: [],
            createdAt: nowTs,
            updatedAt: nowTs,
          }));
        }
        if (command === "get_albums") return [];
        if (command === "get_tags") return [];
        if (command === "get_album_overviews") {
          return Array.from({ length: 100 }, (_, index) => ({
            id: `benchmark-album-${index}`,
            name: `Benchmark Album ${index}`,
            colorIndex: index % 4,
            createdAt: now - index * 60_000,
            updatedAt: now - index * 60_000,
            itemCount: Math.min(100, totalItems - index * 100),
            coverItems: items.slice(index * 4, index * 4 + 4),
          }));
        }
        if (command === "get_album_items") {
          const albumId = args?.albumId || "benchmark-album-0";
          const index = Number(albumId.replace("benchmark-album-", "")) || 0;
          return items.slice(index * 4, index * 4 + 4);
        }
        if (command === "get_library_items") {
          const filter = args?.filter || {};
          const cursor = filter.cursor || "items-0";
          const offset = Math.max(0, Number(cursor.replace("items-", "")) || 0);
          const limit = Math.max(1, Number(filter.limit || PAGE_SIZE));
          const pageItems = items.slice(offset, offset + limit);
          const nextOffset = offset + pageItems.length;
          return {
            items: pageItems,
            hasMore: nextOffset < totalItems,
            nextCursor: nextOffset < totalItems ? `items-${nextOffset}` : undefined,
            totalCount: totalItems,
          };
        }
        if (command === "get_item_thumbnail") {
          benchmark.activeThumbnails += 1;
          benchmark.maxActiveThumbnails = Math.max(
            benchmark.maxActiveThumbnails,
            benchmark.activeThumbnails,
          );
          // Resolve in a microtask so the counter accurately reflects the
          // app's bounded request window without I/O noise.
          await Promise.resolve();
          benchmark.activeThumbnails -= 1;
          return { ...tinyThumbnail, itemId: args?.request?.itemId || "" };
        }
        return [];
      };

      const noop = async (cmd) => {
        if (cmd === "get_settings") return {};
        if (cmd === "get_vault_status") {
          return { configured: false, locked: true, itemCount: 0 };
        }
        return [];
      };

      window.__TAURI_INTERNALS__ = {
        convertFileSrc: (p) => p,
        transformCallback: () => 1,
        invoke: isBenchmark ? syntheticInvoke : noop,
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
        plugins: {},
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} };
    </script>

    <div id="root"></div>
