<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VistoGallery harness</title>
    <script>
      const params = new URLSearchParams(window.location.search);
      const benchmarkItems = Number(params.get("benchmark") || 0);
      const isBenchmark = Number.isFinite(benchmarkItems) && benchmarkItems > 0;
      const totalItems = Math.max(0, Math.floor(benchmarkItems || 0));
      // `videos=N` renders the first N synthetic items as videos so the tile's
      // play-in-background action can be exercised.
      const videoCount = Math.max(0, Math.floor(Number(params.get("videos") || 0)));
      // `wmv=N` turns the first N videos into .wmv files whose probe cannot be
      // remuxed, so the player offers "Convert to play here".
      const wmvCount = Math.min(
        videoCount,
        Math.max(0, Math.floor(Number(params.get("wmv") || 0))),
      );
      // `tracks=1` makes the first video a Matroska whose probe carries two
      // audio tracks and a subtitle, so the player's track menus are driven by
      // real probe data rather than by a hand-crafted component state.
      const trackProbe = params.get("tracks") === "1";
      // `longNames=N` stretches every fixture name so the list tables' name
      // truncation and column floors can be exercised end to end. N repeats
      // the fixture name N times: `1` is the usual long name, and a test that
      // needs overflow no matter the platform font asks for a multiple.
      const longNameRepeats = Math.max(0, Math.floor(Number(params.get("longNames") || 0)));
      const longNames = longNameRepeats > 0;
      // `raw=N` makes the N items after the videos RAW files (.dng), whose
      // viewer image comes from `get_display_preview`.
      const rawCount = Math.max(0, Math.floor(Number(params.get("raw") || 0)));
      window.__previewCalls = [];
      // `lock=1` turns on the Hidden lock; the system prompt always succeeds.
      const hiddenLockRequired = params.get("lock") === "1";
      let hiddenUnlocked = false;
      const hiddenVisible = () => !hiddenLockRequired || hiddenUnlocked;
      // `dayStep=N` spaces items N days apart (default one minute) so the
      // Timeline spans many months and years.
      const dayStep = Math.max(0, Number(params.get("dayStep") || 0));
      const itemStepMs = dayStep > 0 ? dayStep * 86_400_000 : 60_000;
      // `albums=N` limits the synthetic album overviews; `albums=0` reaches the
      // Albums screen's empty state.
      const albumOverviewParam = params.get("albums");
      const albumOverviewCount =
        albumOverviewParam == null ? 100 : Math.max(0, Math.floor(Number(albumOverviewParam) || 0));
      // An explicit order for the regular albums so the Albums screen's
      // reorder feature can be driven end to end.
      let albumOrder = Array.from(
        { length: albumOverviewCount },
        (_, index) => `benchmark-album-${index}`,
      );
      const PAGE_SIZE = 250;
      const now = Date.UTC(2026, 10, 3, 12, 0, 0);
      const tinyImage = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
      // A real 1-second H.264 clip so the video player in the harness mounts a
      // decodable <video> element instead of the decode-failure screen.
      const tinyVideoData =
        "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAABERtZGF03ABMYXZjNjMuMS4xMDIAAjBADgAAAq4GBf//qtxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjUgcjMyMjIgYjM1NjA1YSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjUgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0xIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDM6MHgxMTMgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTEgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MyBiX3B5cmFtaWQ9MiBiX2FkYXB0PTEgYl9iaWFzPTAgZGlyZWN0PTEgd2VpZ2h0Yj0xIG9wZW5fZ29wPTAgd2VpZ2h0cD0yIGtleWludD0yNTAga2V5aW50X21pbj0yNSBzY2VuZWN1dD00MCBpbnRyYV9yZWZyZXNoPTAgcmNfbG9va2FoZWFkPTQwIHJjPWNyZiBtYnRyZWU9MSBjcmY9MjMuMCBxY29tcD0wLjYwIHFwbWluPTAgcXBtYXg9NjkgcXBzdGVwPTQgaXBfcmF0aW89MS40MCBhcT0xOjEuMDAAgAAAAA9liIQAO//+906/AptUwmEAAAAIQZokbEO//uAAAAAIQZ5CeIX/wYEBGCAHAAAACAGeYXRCv8SAAAAACAGeY2pCv8SBAAAADkGaaEmoQWiZTAh3//7hARggBwAAAApBnoZFESwv/8GBAAAACAGepXRCv8SBAAAACAGep2pCv8SAARggBwAAAA5BmqxJqEFsmUwId//+4AAAAApBnspFFSwv/8GBAAAACAGe6XRCv8SAARggBwAAAAgBnutqQr/EgAAAAA5BmvBJqEFsmUwIb//+4QAAAApBnw5FFSwv/8GBARggBwAAAAgBny10Qr/EgQAAAAgBny9qQr/EgAAAAA5BmzRJqEFsmUwIZ//+4AAAAApBn1JFFSwv/8GBARggBwAAAAgBn3F0Qr/EgAAAAAgBn3NqQr/EgAAAAA5Bm3hJqEFsmUwIV//+wQEYIAcAAAAKQZ+WRRUsL//BgAAAAAgBn7V0Qr/EgQAAAAgBn7dqQr/EgQAABwVtb292AAAAbG12aGQAAAAAAAAAAAAAAAAAAB9AAAAfQAABAAABAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADw3RyYWsAAABcdGtoZAAAAAMAAAAAAAAAAAAAAAEAAAAAAAAfQAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAEAAAABAAAAAAACRlZHRzAAAAHGVsc3QAAAAAAAAAAQAAH0AAAAQAAAEAAAAAAzttZGlhAAAAIG1kaGQAAAAAAAAAAAAAAAAAADIAAAAyAFXEAAAAAAAtaGRscgAAAAAAAAAAdmlkZQAAAAAAAAAAAAAAAFZpZGVvSGFuZGxlcgAAAALmbWluZgAAABR2bWhkAAAAAQAAAAAAAAAAAAAAJGRpbmYAAAAcZHJlZgAAAAAAAAABAAAADHVybCAAAAABAAACpnN0YmwAAAC+c3RzZAAAAAAAAAABAAAArmF2YzEAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAEAAQAEgAAABIAAAAAAAAAAEUTGF2YzYzLjEuMTAyIGxpYngyNjQAAAAAAAAAAAAAAAAY//8AAAA0YXZjQwFkAAr/4QAXZ2QACqzZXsBEAAADAAQAAAMAyDxIllgBAAZo6+PLIsD9+PgAAAAAEHBhc3AAAAABAAAAAQAAABRidHJ0AAAAAAAAIGgAAAAAAAAAGHN0dHMAAAAAAAAAAQAAABkAAAIAAAAAFHN0c3MAAAAAAAAAAQAAAAEAAADYY3R0cwAAAAAAAAAZAAAAAQAABAAAAAABAAAKAAAAAAEAAAQAAAAAAQAAAAAAAAABAAACAAAAAAEAAAoAAAAAAQAABAAAAAABAAAAAAAAAAEAAAIAAAAAAQAACgAAAAABAAAEAAAAAAEAAAAAAAAAAQAAAgAAAAABAAAKAAAAAAEAAAQAAAAAAQAAAAAAAAABAAACAAAAAAEAAAoAAAAAAQAABAAAAAABAAAAAAAAAAEAAAIAAAAAAQAACgAAAAABAAAEAAAAAAEAAAAAAAAAAQAAAgAAAAA0c3RzYwAAAAAAAAADAAAAAQAAAAMAAAABAAAABgAAAAQAAAABAAAABwAAAAMAAAABAAAAeHN0c3oAAAAAAAAAAAAAABkAAALFAAAADAAAAAwAAAAMAAAADAAAABIAAAAOAAAADAAAAAwAAAASAAAADgAAAAwAAAAMAAAAEgAAAA4AAAAMAAAADAAAABIAAAAOAAAADAAAAAwAAAASAAAADgAAAAwAAAAMAAAAMHN0Y28AAAAAAAAACAAAAEMAAAMkAAADUgAAA3wAAAOsAAAD3AAABBgAAARGAAACbXRyYWsAAABcdGtoZAAAAAMAAAAAAAAAAAAAAAIAAAAAAAAcAAAAAAAAAAAAAAAAAQEAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAACRlZHRzAAAAHGVsc3QAAAAAAAAAAQAAHAAAAAQAAAEAAAAAAeVtZGlhAAAAIG1kaGQAAAAAAAAAAAAAAAAAAB9AAAAgAFXEAAAAAAAtaGRscgAAAAAAAAAAc291bgAAAAAAAAAAAAAAAFNvdW5kSGFuZGxlcgAAAAGQbWluZgAAABBzbWhkAAAAAAAAAAAAAAAkZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAAFUc3RibAAAAH5zdHNkAAAAAAAAAAEAAABubXA0YQAAAAAAAAABAAAAAAAAAAAAAQAQAAAAAB9AAAAAAAA2ZXNkcwAAAAADgICAJQACAASAgIAXQBUAAAAAALuAAAABbwWAgIAFFYhW5QAGgICAAQIAAAAUYnRydAAAAAAAALuAAAABbwAAABhzdHRzAAAAAAAAAAEAAAAIAAAEAAAAABxzdHNjAAAAAAAAAAEAAAABAAAAAQAAAAEAAAA0c3RzegAAAAAAAAAAAAAACAAAABMAAAAEAAAABAAAAAQAAAAEAAAABAAAAAQAAAAEAAAAMHN0Y28AAAAAAAAACAAAADAAAAMgAAADTgAAA3gAAAOoAAAD2AAABBQAAARCAAAAGnNncGQBAAAAcm9sbAAAAAIAAAAB//8AAAAcc2JncAAAAAByb2xsAAAAAQAAAAgAAAABAAAAYXVkdGEAAABZbWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAbWRpcmFwcGwAAAAAAAAAAAAAAAAsaWxzdAAAACSpdG9vAAAAHGRhdGEAAAABAAAAAExhdmY2My4xLjEwMg==";

      const makeItems = () =>
        Array.from({ length: totalItems }, (_, index) => {
          const capturedAt = now - index * itemStepMs;
          const isVideo = index < videoCount;
          const isWmv = index < wmvCount;
          const isTracked = trackProbe && isVideo && !isWmv && index === 0;
          const isRaw = !isVideo && index < videoCount + rawCount;
          const extension = isWmv
            ? "wmv"
            : isTracked
              ? "mkv"
              : isVideo
                ? "mp4"
                : isRaw
                  ? "dng"
                  : "jpg";
          return {
            id: `benchmark-${index}`,
            // A WMV has no in-app source until it is converted; every other
            // video plays the tiny clip so the controls mount.
            path: isWmv
              ? `/synthetic/benchmark-${index}.wmv`
              : isVideo
                ? tinyVideoData
                : `/synthetic/benchmark-${index}.${extension}`,
            name: longNames
              ? `${`this-is-a-very-long-camera-generated-filename-with-a-shared-prefix-${index}-and-a-distinguishing-tail-0042-`.repeat(longNameRepeats).slice(0, -1)}.${extension}`
              : `benchmark-${index}.${extension}`,
            extension,
            kind: isVideo ? "video" : isRaw ? "raw" : "photo",
            size: 1024 * 1024,
            modifiedAt: capturedAt,
            capturedAt,
            width: 1,
            height: 1,
            favorite: index % 11 === 0,
            hidden: false,
            rating: index % 6,
            colorLabel: ["red", "yellow", "green", "blue", "purple"][index % 5],
            tags: index % 17 === 0 ? ["benchmark"] : [],
            albumIds: index < 4 ? ["benchmark-album-0"] : [],
            createdAt: capturedAt,
            updatedAt: capturedAt,
          };
        });
      const items = makeItems();
      if (params.get("gps") === "1" && items.length >= 3) {
        Object.assign(items[0], { latitude: 48.8566, longitude: 2.3522 });
        Object.assign(items[1], { latitude: 48.854, longitude: 2.346 });
        Object.assign(items[items.length - 1], { latitude: -33.8688, longitude: 151.2093 });
      }
      // The hidden set spans months and has its own ids, so the Hidden
      // Timeline's month counts and whole-month Select all can be told apart
      // from the Library's.
      const hiddenItems = (params.has("hiddenCount") ? items.slice(0, Number(params.get("hiddenCount"))) : [items[0], items[7], items[14]])
        .filter(Boolean)
        .map((item, index) => ({ ...item, id: `hidden-${index}`, hidden: true }));
      const benchmark = {
        calls: Object.create(null),
        pages: [],
        activeThumbnails: 0,
        maxActiveThumbnails: 0,
      };
      window.__benchmark = benchmark;

      const count = (command) => {
        benchmark.calls[command] = (benchmark.calls[command] || 0) + 1;
      };
      const tinyThumbnail = {
        itemId: "",
        dataUrl: tinyImage,
        width: 1,
        height: 1,
      };

      // The probe ffprobe would return for a synthetic video. `tracks=1` gives
      // it two audio tracks (English AAC, French AC-3) and two subtitles:
      // SubRip, which becomes `mov_text`, and bitmap PGS, which cannot and is
      // therefore not offered in the player.
      const playbackProbe = (convertible) => ({
        videoCodec: convertible ? "wmv2" : "h264",
        pixelFormat: "yuv420p",
        codecTag: convertible ? null : "avc1",
        audioCodec: convertible ? "wmav2" : "aac",
        audioProfile: convertible ? null : "LC",
        audioTracks: trackProbe
          ? [
              { index: 1, codec: "aac", language: "eng", title: "Main", channels: 2 },
              { index: 2, codec: "ac3", language: "fra", title: null, channels: 6 },
            ]
          : [{ index: 1, codec: "aac", language: "eng", title: null, channels: 2 }],
        subtitleTracks: trackProbe
          ? [
              { index: 3, codec: "subrip", language: "eng", title: null },
              { index: 4, codec: "hdmv_pgs_subtitle", language: "fra", title: null },
            ]
          : [],
        durationMs: 1000,
        width: 16,
        height: 16,
        bitDepth: 8,
      });

      // A conversion stays pending until the test finishes or cancels it, so
      // progress and the cancel button are driven without a race.
      let pendingConversion = null;
      window.__finishPlaybackConversion = () => {
        const pending = pendingConversion;
        pendingConversion = null;
        pending?.resolve();
      };
      // The player listens on `playback-conversion`; this delivers a tick
      // through the same handler the Tauri event plugin would call.
      const eventHandlers = new Map();
      window.__emitPlaybackProgress = (path, progress) => {
        eventHandlers.get("playback-conversion")?.({
          event: "playback-conversion",
          id: 0,
          payload: { path, progress },
        });
      };

      // Smart albums are mutable so the Albums screen's create/edit/delete
      // affordances can be driven end to end, not just rendered.
      // `smartAlbums=N` seeds N of them (default 8, `0` for the empty state).
      const smartAlbumSeedParam = params.get("smartAlbums");
      const smartAlbumSeedCount =
        smartAlbumSeedParam == null ? 8 : Math.max(0, Math.floor(Number(smartAlbumSeedParam) || 0));
      let smartAlbumCounter = 0;
      const nowTs = Date.now();
      const smartAlbumNames = [
        "Favorites",
        "RAW+Jpeg",
        "Autumn shots",
        "Videos",
        "People",
        "2024",
        "Best of",
        "Travel",
      ];
      let smartAlbums = Array.from({ length: smartAlbumSeedCount }, (_, index) => ({
        id: `smart-${index}`,
        name: smartAlbumNames[index] ?? `Smart ${index}`,
        filter:
          index === 0 ? { favorite: true } : index === 1 ? { kind: "raw" } : { query: "autumn" },
        itemCount: index === 0 ? 11 : 7,
        coverItems: [],
        createdAt: nowTs,
        updatedAt: nowTs,
      }));

      const syntheticInvoke = async (command, args) => {
        count(command);
        if (command === "get_settings") return {};
        if (command === "get_version") return "0.2.2";
        if (command === "get_vault_status") {
          return { configured: false, locked: true, itemCount: 0 };
        }
        if (command === "external_video_players") return [];
        if (command === "log_playback_diagnostic") return null;
        if (command === "prepare_playback") {
          const path = args?.path || "";
          // Only a WMV resists a remux; the tracked Matroska is reported as
          // remuxed, which is the strategy the real backend picks for it.
          const convertible = /\.wmv$/i.test(path);
          return {
            strategy: convertible ? "unsupported" : trackProbe ? "remuxed" : "native",
            path,
            probe: playbackProbe(convertible),
            detail: convertible
              ? "This file uses wmv2, which the in-app player cannot decode."
              : null,
            canConvert: convertible,
          };
        }
        if (command === "convert_playback") {
          const converted = {
            strategy: "converted",
            path: tinyVideoData,
            probe: playbackProbe(false),
            detail: null,
            canConvert: false,
          };
          return new Promise((resolve, reject) => {
            pendingConversion = { resolve: () => resolve(converted), reject };
          });
        }
        if (command === "cancel_playback_conversion") {
          const pending = pendingConversion;
          pendingConversion = null;
          pending?.reject({ code: "cancelled", message: "Conversion cancelled." });
          return true;
        }
        if (command === "hidden_lock_status") {
          return {
            required: hiddenLockRequired,
            unlocked: hiddenVisible(),
            available: true,
            method: "touchId",
          };
        }
        if (command === "unlock_hidden") {
          hiddenUnlocked = true;
          return true;
        }
        if (command === "keep_hidden_unlocked") return hiddenVisible();
        if (command === "lock_hidden") {
          hiddenUnlocked = false;
          return null;
        }
        if (command === "get_library_stats") {
          return {
            photos: totalItems - videoCount,
            videos: videoCount,
            raws: 0,
            animations: 0,
            animationsSize: 0,
            uncategorized: 0,
            favorites: Math.floor(totalItems / 11),
            hidden: hiddenVisible() ? 7 : 0,
            photoSize: totalItems * 1024 * 1024,
            videoSize: 0,
            rawSize: 0,
            uncategorizedSize: 0,
            favoriteSize: Math.floor(totalItems / 11) * 1024 * 1024,
            hiddenSize: 0,
            totalSize: totalItems * 1024 * 1024,
          };
        }
        if (command === "get_library_roots") return ["/synthetic"];
        if (command === "get_library_folders") {
          return [
            {
              path: "/synthetic",
              name: "synthetic",
              itemCount: totalItems,
              totalSize: totalItems * 1024 * 1024,
            },
          ];
        }
        if (command === "watch_folder" || command === "unwatch_folder") return null;
        if (command === "get_smart_albums") {
          return smartAlbums.map((album) => ({ ...album }));
        }
        if (command === "create_smart_album") {
          const album = {
            id: `smart-new-${smartAlbumCounter++}`,
            name: args?.name || "Untitled",
            filter: args?.filter || {},
            itemCount: 0,
            coverItems: [],
            createdAt: Date.now(),
            updatedAt: Date.now(),
          };
          smartAlbums = [...smartAlbums, album];
          return album;
        }
        if (command === "update_smart_album") {
          const index = smartAlbums.findIndex((album) => album.id === args?.albumId);
          if (index === -1) throw new Error("Smart Album not found");
          const album = {
            ...smartAlbums[index],
            name: args?.name ?? smartAlbums[index].name,
            filter: args?.filter ?? smartAlbums[index].filter,
            updatedAt: Date.now(),
          };
          smartAlbums = smartAlbums.map((entry, i) => (i === index ? album : entry));
          return album;
        }
        if (command === "rename_smart_album") {
          smartAlbums = smartAlbums.map((album) =>
            album.id === args?.albumId ? { ...album, name: args?.name ?? album.name } : album,
          );
          return null;
        }
        if (command === "delete_smart_album") {
          smartAlbums = smartAlbums.filter((album) => album.id !== args?.albumId);
          return null;
        }
        if (command === "get_albums") return [];
        if (command === "get_tags") return [];
        if (command === "get_album_overviews") {
          const positions = new Map(albumOrder.map((id, index) => [id, index]));
          return Array.from({ length: albumOverviewCount }, (_, index) => ({
            id: `benchmark-album-${index}`,
            name: longNames
              ? `A Very Long Album Name With A Shared Prefix And A Distinguishing Tail ${index} 2026`
              : `Benchmark Album ${index}`,
            colorIndex: index % 4,
            createdAt: now - index * 60_000,
            updatedAt: now - index * 60_000,
            itemCount: Math.max(0, Math.min(100, totalItems - index * 100)),
            itemSize: Math.max(0, Math.min(100, totalItems - index * 100)) * 3 * 1024 * 1024,
            coverItems: items.slice(index * 4, index * 4 + 4),
          })).sort(
            (a, b) =>
              (positions.get(a.id) ?? albumOrder.length) -
              (positions.get(b.id) ?? albumOrder.length),
          );
        }
        if (command === "reorder_albums") {
          const ids = Array.isArray(args?.albumIds)
            ? args.albumIds.filter((id) => typeof id === "string")
            : [];
          if (ids.length !== albumOrder.length) {
            throw new Error("Reorder needs every album id exactly once");
          }
          albumOrder = [...ids];
          return null;
        }
        if (command === "get_album_items") {
          const albumId = args?.albumId || "benchmark-album-0";
          const index = Number(albumId.replace("benchmark-album-", "")) || 0;
          return items.slice(index * 4, index * 4 + 4);
        }
        // Capture times are wall-clock stored as UTC, so months are UTC.
        const monthOf = (item) => new Date(item.capturedAt).toISOString().slice(0, 7);
        // The same scope rules the real query applies, so the Hidden Timeline
        // gets hidden months and the Library gets visible ones.
        const scopeFor = (filter) =>
          filter.hidden === true ? hiddenItems : filter.hidden === false ? items : [...items, ...hiddenItems];
        const inScope = (item, filter) => {
          if (filter.kind && item.kind !== filter.kind) return false;
          if (filter.favorite === true && !item.favorite) return false;
          if (filter.animated === true && !/\.gif$/i.test(item.name)) return false;
          return true;
        };
        if (command === "get_timeline_months") {
          const filter = args?.filter || {};
          const months = new Map();
          for (const item of scopeFor(filter)) {
            if (!inScope(item, filter)) continue;
            const key = monthOf(item);
            const month = months.get(key) ?? { key, count: 0, coverIds: [] };
            month.count += 1;
            if (month.coverIds.length < 4) month.coverIds.push(item.id);
            months.set(key, month);
          }
          return [...months.values()];
        }
        if (command === "get_matching_ids") {
          const filter = args?.filter || {};
          const month = filter.month;
          return scopeFor(filter)
            .filter((item) => inScope(item, filter))
            .filter((item) => !month || monthOf(item) === month)
            .map((item) => item.id);
        }
        if (command === "get_display_preview") {
          window.__previewCalls.push({ itemId: args?.itemId, full: !!args?.full });
          // Slow enough for the low-resolution badge to be seen first.
          await new Promise((resolve) => setTimeout(resolve, 400));
          return { path: null, dataUrl: tinyImage, width: 1, height: 1, full: !!args?.full };
        }
        if (command === "get_photo_locations") {
          return items
            .filter((item) => item.kind !== "video" && item.latitude != null && item.longitude != null)
            .map(({ id, name, latitude, longitude, capturedAt, modifiedAt }) => ({
              id, name, latitude, longitude, capturedAt, modifiedAt,
            }));
        }
        if (command === "get_items_by_ids") {
          const byId = new Map([...items, ...hiddenItems].map((item) => [item.id, item]));
          return (args?.ids || []).map((id) => byId.get(id)).filter(Boolean);
        }
        if (command === "get_library_items" || command === "get_hidden_items") {
          const filter = args?.filter || {};
          const hidden = command === "get_hidden_items";
          if (hidden && !hiddenVisible()) throw { code: "locked", message: "Hidden is locked." };
          const source = hidden ? hiddenItems : items;
          const matching = filter.month ? source.filter(item => monthOf(item) === filter.month && inScope(item, filter)) : source;
          benchmark.pages.push({ month: filter.month, cursor: filter.cursor, limit: filter.limit, hidden });
          const cursor = filter.cursor || "items-0";
          const offset = Math.max(0, Number(cursor.replace("items-", "")) || 0);
          const limit = Math.max(1, Number(filter.limit || PAGE_SIZE));
          const pageItems = matching.slice(offset, offset + limit);
          const nextOffset = offset + pageItems.length;
          return {
            items: pageItems,
            hasMore: nextOffset < matching.length,
            nextCursor: nextOffset < matching.length ? `items-${nextOffset}` : undefined,
            totalCount: matching.length,
          };
        }
        if (command === "get_item_thumbnail") {
          benchmark.activeThumbnails += 1;
          benchmark.maxActiveThumbnails = Math.max(
            benchmark.maxActiveThumbnails,
            benchmark.activeThumbnails,
          );
          // Resolve in a microtask so the counter accurately reflects the
          // app's bounded request window without I/O noise.
          await Promise.resolve();
          benchmark.activeThumbnails -= 1;
          return { ...tinyThumbnail, itemId: args?.request?.itemId || "" };
        }
        return [];
      };

      const noop = async (cmd, args) => {
        if (cmd === "get_settings") return {};
        if (cmd === "get_vault_status") {
          return { configured: false, locked: true, itemCount: 0 };
        }
        // Cleanup screen: a demo inventory so the screen has something to show
        // in the harness and in README captures. One report per category.
        if (cmd === "scan_junk") {
          const daysAgo = (days) => Date.now() - days * 24 * 60 * 60 * 1000;
          const row = (item) => ({ sharedBytes: 0, extraPaths: [], ...item });
          const byCategory = {
            xcode: {
              items: [
                row({
                  id: "xcode-derived-data",
                  category: "xcode",
                  label: "Xcode DerivedData",
                  detail: "Build products and indexes — Xcode rebuilds them on the next build",
                  path: "/Users/you/Library/Developer/Xcode/DerivedData",
                  bytes: 19756849562,
                  fileCount: 48213,
                  lastUsedAt: daysAgo(2),
                  tier: "regenerable",
                }),
                row({
                  id: "xcode-device-support",
                  category: "xcode",
                  label: "Device support symbols",
                  detail: "Debug symbols Xcode copies again the next time a device connects",
                  path: "/Users/you/Library/Developer/Xcode/iOS DeviceSupport",
                  extraPaths: ["/Users/you/Library/Developer/Xcode/watchOS DeviceSupport"],
                  bytes: 6549825126,
                  fileCount: 12884,
                  lastUsedAt: daysAgo(21),
                  tier: "regenerable",
                }),
                row({
                  id: "xcode-archives",
                  category: "xcode",
                  label: "Xcode Archives",
                  detail: "Signed builds and dSYMs — keep them if you symbolicate crash logs",
                  path: "/Users/you/Library/Developer/Xcode/Archives",
                  bytes: 1932735283,
                  fileCount: 42,
                  lastUsedAt: daysAgo(150),
                  tier: "rebuildable",
                }),
              ],
              skips: [],
            },
            packages: {
              items: [
                row({
                  id: "npm-cache",
                  category: "packages",
                  label: "npm cache",
                  detail: "Package tarballs npm downloads again when it needs them",
                  path: "/Users/you/.npm/_cacache",
                  bytes: 3435973837,
                  fileCount: 91120,
                  lastUsedAt: daysAgo(6),
                  tier: "regenerable",
                }),
                row({
                  id: "homebrew-cache",
                  category: "packages",
                  label: "Homebrew cache",
                  detail: "Downloaded bottles and formula sources",
                  path: "/Users/you/Library/Caches/Homebrew",
                  bytes: 1288490188,
                  fileCount: 214,
                  lastUsedAt: daysAgo(12),
                  tier: "regenerable",
                }),
              ],
              skips: [
                {
                  id: "cargo-cache",
                  category: "packages",
                  label: "Cargo registry cache",
                  path: "/Users/you/.cargo/registry/cache",
                  bytes: 966367641,
                  reason: "appRunning",
                  message: "cargo is running",
                },
              ],
            },
            projects: {
              items: [
                row({
                  id: "projects:/Users/you/Code/atlas/node_modules",
                  category: "projects",
                  label: "atlas/node_modules",
                  detail: "Dependencies in ~/Code/atlas — reinstall with npm, yarn or pnpm install",
                  path: "/Users/you/Code/atlas/node_modules",
                  bytes: 851443712,
                  sharedBytes: 214748364,
                  fileCount: 21406,
                  lastUsedAt: daysAgo(120),
                  tier: "rebuildable",
                }),
                row({
                  id: "projects:/Users/you/Code/engine/target",
                  category: "projects",
                  label: "engine/target",
                  detail: "Rust build output in ~/Code/engine — cargo build recreates it",
                  path: "/Users/you/Code/engine/target",
                  bytes: 4294967296,
                  fileCount: 18877,
                  lastUsedAt: daysAgo(34),
                  tier: "rebuildable",
                }),
              ],
              skips: [
                {
                  id: "projects:/Users/you/Code/site/node_modules",
                  category: "projects",
                  label: "site/node_modules",
                  path: "/Users/you/Code/site/node_modules",
                  bytes: 412316860,
                  reason: "recentActivity",
                  message: "Changed in the last few minutes — probably in use",
                },
              ],
            },
            downloads: {
              items: [
                row({
                  id: "downloads:/Users/you/Downloads/Xcode_15.4.xip",
                  category: "downloads",
                  label: "Xcode_15.4.xip",
                  detail: "Installer downloaded 210 days ago — download it again if you need it",
                  path: "/Users/you/Downloads/Xcode_15.4.xip",
                  bytes: 2576980378,
                  fileCount: 1,
                  lastUsedAt: daysAgo(210),
                  tier: "rebuildable",
                }),
              ],
              skips: [],
            },
          };
          const category = args?.category ?? "xcode";
          const entry = byCategory[category] ?? { items: [], skips: [] };
          await new Promise((resolve) =>
            setTimeout(resolve, { xcode: 450, packages: 700, projects: 1300, downloads: 250 }[category] ?? 300),
          );
          return {
            category,
            status: "complete",
            statusMessage: null,
            note: null,
            items: entry.items,
            skips: entry.skips,
            totalBytes: entry.items.reduce((sum, item) => sum + item.bytes, 0),
            scannedAt: Date.now(),
          };
        }
        if (cmd === "get_cleanup_overview") {
          const GB = 1024 * 1024 * 1024;
          return {
            disk: { totalBytes: 994 * GB, availableBytes: 118 * GB },
            personalFolders: true,
            library: {
              totalItems: 18342,
              totalBytes: 212 * GB,
              photoBytes: 74 * GB,
              videoBytes: 121 * GB,
              rawBytes: 17 * GB,
              largeVideoCount: 23,
              largeVideoBytes: 58 * GB,
            },
            history: [
              {
                finishedAt: Date.now() - 3 * 24 * 60 * 60 * 1000,
                removedItems: 6,
                movedBytes: 14 * GB,
                failedItems: 0,
              },
            ],
          };
        }
        if (cmd === "list_junk_ignored") return [];
        if (cmd === "clean_junk") return { removedItems: 0, movedBytes: 0, failed: [] };
        if (
          cmd === "reveal_junk" ||
          cmd === "set_junk_ignored" ||
          cmd === "set_cleanup_personal_folders" ||
          cmd === "open_trash"
        ) {
          return null;
        }
        return [];
      };

      // `listen()` registers its handler through `transformCallback`, then
      // hands the id to the event plugin. Keeping the callbacks lets a test
      // emit an event the way the backend does.
      const callbacks = new Map();
      let callbackCounter = 0;

      window.__TAURI_INTERNALS__ = {
        convertFileSrc: (p) => p,
        transformCallback: (callback) => {
          callbackCounter += 1;
          callbacks.set(callbackCounter, callback);
          return callbackCounter;
        },
        invoke: async (command, args) => {
          if (command === "get_storage_usage") {
            return { catalogBytes: 8192, thumbnailBytes: 0, thumbnailFiles: 0, playbackBytes: 0,
              playbackFiles: 0, editOriginalBytes: 0, editOriginalFiles: 0 };
          }
          if (command === "default_apps_status") {
            return {
              supported: false,
              unsupportedReason: "Default apps can be set from the installed app.",
              types: [],
            };
          }
          if (command === "plugin:event|listen") {
            const handler = callbacks.get(args?.handler);
            if (handler) eventHandlers.set(args.event, handler);
            return args?.handler ?? 0;
          }
          if (command === "plugin:event|unlisten") {
            eventHandlers.delete(args?.event);
            return null;
          }
          // The cleanup screen uses the same demo inventory in both modes; the
          // benchmark fixtures do not model system junk.
          if (
            [
              "scan_junk",
              "clean_junk",
              "reveal_junk",
              "set_junk_ignored",
              "list_junk_ignored",
              "get_cleanup_overview",
              "set_cleanup_personal_folders",
              "open_trash",
            ].includes(command)
          ) {
            return noop(command, args);
          }
          return isBenchmark ? syntheticInvoke(command, args) : noop(command, args);
        },
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
        plugins: {},
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} };
    </script>
