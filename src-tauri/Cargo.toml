[package]
name = "visto-gallery"
version = "0.5.0"
description = "A fast, local-first photo & video gallery app for macOS"
authors = ["Devendra Kumar"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Davin-X/visto-gallery"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset",
    "http-range",
] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

# Async runtime
tokio = { version = "1", features = ["full", "macros"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "time", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
base64 = "0.23"
xattr = "1.6"
plist = "1.10"
kamadak-exif = "0.6"
notify = "8"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
time = { version = "0.3", features = ["serde", "formatting", "macros", "std"] }
chrono = { version = "0.4", features = ["serde"] }

# Trash
trash = "5"

# Error handling
anyhow = "1"
thiserror = "2"


# Image processing
image = "0.25"

# Hashing
ring = "0.17"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
walkdir = "2"
libc = "0.2"
dirs = "7"

# Update checks
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
semver = "1"

# Touch ID / Mac password for the Hidden lock
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSDistributedNotificationCenter", "NSNotification", "NSOperation", "NSURL", "NSArray", "NSDictionary", "NSValue"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError", "LABiometryType"] }

[dev-dependencies]
filetime = "0.2"

[patch.crates-io]
wry = { path = "vendor/wry" }
