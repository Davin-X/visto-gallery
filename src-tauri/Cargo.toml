[package]
name = "visto-gallery"
version = "0.1.1"
description = "A fast, local-first photo & video gallery app for macOS"
authors = ["Devendra Kumar"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Davin-X/visto-gallery"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset",
    "http-range",
] }
tauri-plugin-dialog = "2"

# Async runtime
tokio = { version = "1", features = ["full", "macros"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "time", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
xattr = "1.6"
plist = "1.10"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
time = { version = "0.3", features = ["serde", "formatting", "macros", "std"] }
chrono = { version = "0.4", features = ["serde"] }

# Trash
trash = "5"

# Error handling
anyhow = "1"


# Image processing
image = "0.25"

# Hashing
ring = "0.17"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
walkdir = "2"
dirs = "5"
