version: 2
updates:
  # Keep npm dependencies current
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # TypeScript 7 is the native compiler; @typescript-eslint 8 still declares
    # a peer range that excludes it, so every screenshot of this bump fails npm
    # ci with ERESOLVE. Revisit when the eslint plugin supports 7.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # eslint 10 is installable for typescript-eslint 8, but
      # eslint-plugin-react 7.37.5 (latest) still caps its peer range at ^9.7,
      # so npm ci fails with ERESOLVE before lint or the build can run (#313).
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "npm"
    reviewers:
      - "Davin-X"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Keep Rust/Tauri dependencies current
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "Davin-X"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Keep workflow actions current so CI never drifts onto a retired runtime
  # again (the v4 actions sat on deprecated Node 20 until #238). One grouped
  # PR a week instead of one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    reviewers:
      - "Davin-X"
    commit-message:
      prefix: "ci(deps)"
