name: Release

# Tag pushes only. The tag itself is created locally with `git tag -s`, so GitHub
# shows it as Verified; this workflow never creates or moves a tag.
on:
  push:
    tags: ["v*"]
  # Recovery path: re-publish an existing tag after the workflow itself is fixed.
  # The tag is never created or moved here; it must already exist.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.4.0
        required: true

permissions:
  contents: write # gh release create/upload
  id-token: write # provenance attestation
  attestations: write

jobs:
  # ffmpeg and ffprobe ship as Tauri sidecars, and `tauri-build` fails when the
  # files listed in `externalBin` are missing. Same build as CI uses.
  sidecars:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the ffmpeg source and built sidecars
        uses: actions/cache@v6
        with:
          path: |
            .ffmpeg-work
            src-tauri/binaries
          key: ffmpeg-src-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          restore-keys: ffmpeg-src-
      - name: Build the static sidecars
        run: bash scripts/build-ffmpeg.sh
        env:
          VISTO_FFMPEG_WORK: ${{ github.workspace }}/.ffmpeg-work
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-sidecars
          path: src-tauri/binaries/*
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: macos-latest
    needs: sidecars
    env:
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-sidecars
          path: src-tauri/binaries
      - name: Make the sidecars executable
        run: chmod +x src-tauri/binaries/*

      # Tauri signs and notarizes natively when these are present, but an empty
      # APPLE_SIGNING_IDENTITY still turns signing on and then fails with
      # `no identity found`. Only export the variables when a certificate exists.
      - name: Configure Apple signing
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VALUE: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${IDENTITY:-}" ]; then
            echo "::warning::No Developer ID certificate configured. The DMG will be ad-hoc signed and Gatekeeper will block it on first launch."
            exit 0
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$APPLE_ID_VALUE"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_VALUE"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_VALUE"
          } >> "$GITHUB_ENV"
          echo "Signing and notarizing with: $IDENTITY"

      # `--bundles dmg` alone makes tauri delete the intermediate .app after the
      # image is written, so ask for both and keep the bundle to inspect.
      - name: Build the app and the DMG
        run: npm run tauri build -- --bundles app,dmg

      # Records which of the two possible states shipped. Neither check fails the
      # job: an ad-hoc build is a known, documented state, not a build error.
      - name: Report the signature state
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/VistoGallery.app"
          test -d "$app" || { echo "::error::$app was not built"; exit 1; }
          codesign -dv --verbose=2 "$app" 2>&1 | tee /tmp/codesign.txt || true
          if grep -q 'adhoc' /tmp/codesign.txt; then
            echo "::warning::The app is ad-hoc signed. Set APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID so Gatekeeper accepts it."
          else
            codesign --verify --deep --strict "$app"
            spctl -a -vvv -t exec "$app"
          fi

      # Not `dist`: vite already owns that directory for the frontend bundle.
      - name: Collect the artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/
          test -s release-assets/*.dmg || { echo "::error::no DMG was produced"; exit 1; }
          cd release-assets
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Kept so a publish failure does not lose the built binaries.
      - name: Keep the artifacts for this run
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      # Optional: a detached signature lets anyone verify the DMG against the GPG
      # key in docs/VERIFYING_RELEASES.md, even before the Apple certificate exists.
      - name: Sign the DMG with the release key
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::RELEASE_GPG_PRIVATE_KEY is not set; the DMG has no detached signature."
            exit 0
          fi
          command -v gpg >/dev/null || brew install --quiet gnupg
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          for dmg in release-assets/*.dmg; do
            gpg --batch --yes --armor --local-user "$fingerprint" --detach-sign "$dmg"
          done
          echo "Signed with $fingerprint"
          ls -l release-assets

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*.dmg"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${TAG_NAME}"
          version="${tag#v}"
          echo "Publishing $tag ($version)"
          # The page leads with the download so the DMG under Assets is in view;
          # the changelog section and verification steps are folded away.
          changes="$(mktemp)"
          awk -v ver="$version" '
            /^## \[/ { if (index($0, "[" ver "]") > 0) { found = 1; next } else if (found) { exit } }
            found { print }
          ' CHANGELOG.md > "$changes"
          if [ ! -s "$changes" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          dmg="$(basename "$(ls release-assets/*.dmg | head -n 1)")"
          # Describe what this build actually ships: an ad-hoc signed app needs
          # the Gatekeeper workaround, and the GPG step is skipped without a key.
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            open_tip=" Not notarized yet: the first time, right-click the app and choose **Open** ([help](https://github.com/Davin-X/visto-gallery#macos-gatekeeper-unsigned-build))."
          else
            open_tip=""
          fi
          if ls release-assets/*.asc >/dev/null 2>&1; then
            gpg_note="and the GPG signature (\`.asc\`)"
          else
            gpg_note="(this build has no GPG signature)"
          fi
          notes="$(mktemp)"
          {
            echo "**Download \`$dmg\` from Assets below** (Apple Silicon).$open_tip"
            echo
            echo "<details>"
            echo "<summary><b>What's new in $version</b></summary>"
            echo
            cat "$changes"
            echo
            echo "</details>"
            echo
            echo "<details>"
            echo "<summary><b>Verify the download</b></summary>"
            echo
            echo "Check the SHA-256 in \`SHA256SUMS.txt\`, the build provenance attestation $gpg_note as described in [VERIFYING_RELEASES.md](https://github.com/Davin-X/visto-gallery/blob/main/docs/VERIFYING_RELEASES.md)."
            echo
            echo "</details>"
          } > "$notes"
          gh release create "$tag" --verify-tag --title "VistoGallery $version" --notes-file "$notes" release-assets/* \
            || gh release upload "$tag" release-assets/* --clobber
