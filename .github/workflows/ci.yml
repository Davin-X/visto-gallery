name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ffmpeg and ffprobe ship as Tauri sidecars, and `tauri-build` fails when the
  # files listed in `externalBin` are missing. So every job that compiles the
  # app needs them: build once here, pass them along as an artifact.
  sidecars:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the ffmpeg source and built sidecars
        uses: actions/cache@v4
        with:
          path: |
            .ffmpeg-work
            src-tauri/binaries
          # The tarball only changes when the version pinned in the script does.
          key: ffmpeg-src-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          restore-keys: ffmpeg-src-
      - name: Build the static sidecars
        run: bash scripts/build-ffmpeg.sh
        env:
          VISTO_FFMPEG_WORK: ${{ github.workspace }}/.ffmpeg-work
      - name: The sidecars run and link nothing outside the system
        run: |
          set -euo pipefail
          triple="$(rustc -vV | awk '/^host: /{print $2}')"
          for tool in ffmpeg ffprobe; do
            binary="src-tauri/binaries/$tool-$triple"
            test -x "$binary" || { echo "::error::$tool was not built"; exit 1; }
            "$binary" -version | head -1
            foreign="$(otool -L "$binary" | tail -n +2 | awk '{print $1}' | grep -v '^/usr/lib/' | grep -v '^/System/' || true)"
            if [ -n "$foreign" ]; then
              echo "::error::$tool links against non-system libraries: $foreign"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-sidecars
          path: src-tauri/binaries/*
          if-no-files-found: error
          retention-days: 7

  # Proves the bundled pair is what actually sits inside the app people download.
  bundle:
    runs-on: macos-latest
    needs: sidecars
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-sidecars
          path: src-tauri/binaries
      - name: Build the app bundle
        run: npm run tauri build -- --bundles app
      - name: The bundle ships the sidecars
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/VistoGallery.app"
          for tool in ffmpeg ffprobe; do
            binary="$app/Contents/MacOS/$tool"
            test -x "$binary" || { echo "::error::$tool is missing from the bundle"; exit 1; }
            "$binary" -version | head -1
          done

  rust:
    runs-on: macos-latest
    needs: sidecars
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-sidecars
          path: src-tauri/binaries
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: generated IPC types are up to date
        run: test -z "$(git status --porcelain -- src/engine/types/generated)"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run harness smoke test
        run: npm run test:e2e
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # Advisory ignores (aligned with src-tauri/deny.toml [advisories].ignore).
      # cargo-audit scans Cargo.lock and also ignores RUSTSEC-2023-0071 (rsa via
      # sqlx-mysql appears in the lockfile but not the compiled graph cargo-deny
      # analyzes, so deny.toml omits it to avoid advisory-not-detected).
      # RUSTSEC-2026-0459 (libsqlite3-sys WAL): restore/validation opens only an
      # isolated temp copy of the chosen .db (no sibling -wal/-shm). sqlx-sqlite
      # (0.8/0.9) does not yet accept libsqlite3-sys >= 0.39.0; remove once sqlx
      # ships a compatible update.
      # RUSTSEC-2026-0372 (zvariant_derive unmaintained, transitive via
      # tauri-plugin-single-instance → zbus 5): no safe upgrade in our tree until
      # upstream migrates to zbus 6.
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2026-0372
      - name: cargo deny
        run: cargo deny --manifest-path src-tauri/Cargo.toml check
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
