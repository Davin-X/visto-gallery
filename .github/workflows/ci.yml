name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071 (rsa, Marvin attack) is ignored because rsa only
      # reaches Cargo.lock through sqlx-mysql, which sqlx's macros list in the
      # lockfile but this app never compiles (`cargo tree -i rsa` is empty).
      # RUSTSEC-2026-0459 (libsqlite3-sys/SQLite WAL info disclosure) is
      # ignored because exploitation requires opening a database with a crafted
      # sibling -wal file (mismatched page size) from a less-trusted source.
      # Visto opens only its own managed SQLite database in app-controlled
      # storage, not untrusted DB+WAL pairs. sqlx-sqlite (0.8/0.9) does not yet
      # accept libsqlite3-sys >=0.39.0 (the patched release); remove this
      # ignore once sqlx ships a compatible update.
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
